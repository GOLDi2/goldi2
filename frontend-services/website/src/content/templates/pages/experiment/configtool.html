{% import "components/login_wall.html" as login_wall %}
<!doctype html>

<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/src/content/img/GOLDi_Logo.png">
    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0">

    <title>GOLDi LABS</title>
    <meta name="description" content="GOLDi LABS">
    <meta name="author" content="SitePoint">

    <meta property="og:title" content="GOLDi LABS">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.sitepoint.com/a-basic-html5-template/">
    <meta property="og:description" content="GOLDi LABS">
    <meta property="og:image" content="image.png">
  

   <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/img/icon/apple-touch-icon.png">
   <link rel="icon" type="image/png" sizes="32x32" href="/img/icon/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="/img/icon/favicon-16x16.png">
   <link rel="manifest" href="/img/icon/site.webmanifest">
   <link rel="mask-icon" href="/img/icon/safari-pinned-tab.svg" color="#5bbad5">
   <meta name="msapplication-TileColor" content="#333333">
   <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/index.js" defer></script>

    <link rel="stylesheet" href="/css/configtool.css">
    <script src="/js/configtool.js" defer></script>
</head>

<body class="flex flex-col min-h-screen">
    {% call login_wall.wrapper(isLoggedIn) %}
    <div id="root"></div>
    <script>
        document.addEventListener("DOMContentLoaded", ()=>{
            const saveCallback = config =>{
              const form = document.createElement('form');
              form.method = 'POST';
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = "experiment";
              input.value = config;
              form.appendChild(input);

              document.body.appendChild(form);
              form.submit();
            }
            {% if experiment %}
            const experiment = {{ experiment | dump | safe }};
            {% else %}
            const experiment = {};
            {% endif %}
            configTool.create(document.getElementById('root'), "{{api}}", "{{token}}", saveCallback, experiment);
        });
    </script>
    {% endcall %}
    <div class="flex-grow"></div>
</body>
